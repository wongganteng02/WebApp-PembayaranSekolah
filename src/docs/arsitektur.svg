<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
  </defs>
  <rect width="1160" height="700" fill="#ffffff"/>
  <text x="580" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Diagram Arsitektur · Aplikasi Tagihan Siswa SD</text>
  <text x="580" y="60" text-anchor="middle" font-size="13" fill="#64748b">Frontend statis di GitHub Pages  →  API Google Apps Script  →  database Google Sheets</text>

  <!-- kolom judul -->
  <text x="130" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">1 · PENGGUNA</text>
  <text x="470" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">2 · FRONTEND (GitHub Pages)</text>
  <text x="850" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">3 · BACKEND API (Google Apps Script)</text>

  <!-- pengguna -->
  <rect x="30" y="120" width="200" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Admin / Guru TU</text>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#334155">Browser HP atau laptop</text>
  <text x="130" y="192" text-anchor="middle" font-size="12" fill="#334155">Tagihan · Rekap · Tabungan</text>
  <text x="130" y="210" text-anchor="middle" font-size="12" fill="#334155">Data siswa · Akhir tahun · Alumni</text>

  <rect x="30" y="270" width="200" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Siswa / Wali murid</text>
  <text x="130" y="322" text-anchor="middle" font-size="12" fill="#334155">Login dengan NISN</text>
  <text x="130" y="342" text-anchor="middle" font-size="12" fill="#334155">Lihat tagihan, pembayaran,</text>
  <text x="130" y="360" text-anchor="middle" font-size="12" fill="#334155">dan tabungan sendiri</text>

  <!-- frontend -->
  <rect x="320" y="120" width="300" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Repo GitHub → GitHub Pages</text>
  <rect x="340" y="164" width="260" height="46" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="470" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">index.html</text>
  <text x="470" y="201" text-anchor="middle" font-size="11" fill="#b45309">&lt;meta name="api-url"&gt; = link /exec</text>
  <rect x="340" y="220" width="260" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="470" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">app1.js</text>
  <text x="470" y="254" text-anchor="middle" font-size="11" fill="#475569">API_URL · srv() · login · sidebar</text>
  <rect x="340" y="270" width="260" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="470" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">app2.js</text>
  <text x="470" y="304" text-anchor="middle" font-size="11" fill="#475569">Dashboard · Tagihan · Rekap · Tabungan</text>
  <rect x="340" y="320" width="260" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="470" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">app3.js</text>
  <text x="470" y="354" text-anchor="middle" font-size="11" fill="#475569">Akhir tahun · Alumni</text>
  <text x="470" y="388" text-anchor="middle" font-size="11" fill="#475569">localStorage: token "ingat saya"</text>
  <text x="470" y="405" text-anchor="middle" font-size="11" fill="#475569">Hosting statis, gratis, HTTPS</text>

  <!-- CDN -->
  <rect x="320" y="450" width="300" height="86" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="470" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">CDN pihak ketiga</text>
  <text x="470" y="498" text-anchor="middle" font-size="12" fill="#334155">SweetAlert2 · Chart.js · SheetJS (xlsx)</text>
  <text x="470" y="516" text-anchor="middle" font-size="12" fill="#334155">Google Fonts (Plus Jakarta Sans)</text>

  <!-- backend -->
  <rect x="700" y="120" width="300" height="300" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="850" y="148" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">Code.gs · Web App /exec</text>
  <rect x="720" y="164" width="260" height="46" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="850" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">doPost(e) → router API</text>
  <text x="850" y="201" text-anchor="middle" font-size="11" fill="#475569">body {fn, args} → API[fn](...args)</text>
  <rect x="720" y="220" width="260" height="42" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="850" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Autentikasi</text>
  <text x="850" y="254" text-anchor="middle" font-size="11" fill="#475569">SHA-256 · token sesi 6 jam · maks 5x salah</text>
  <rect x="720" y="270" width="260" height="42" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="850" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Logika bisnis</text>
  <text x="850" y="304" text-anchor="middle" font-size="11" fill="#475569">Tagihan · pembayaran · tabungan · naik kelas</text>
  <rect x="720" y="320" width="260" height="42" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="850" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Layanan Google</text>
  <text x="850" y="354" text-anchor="middle" font-size="11" fill="#475569">CacheService · PropertiesService · LockService</text>
  <text x="850" y="388" text-anchor="middle" font-size="11" fill="#475569">Jalan sebagai pemilik · akses: Anyone</text>
  <text x="850" y="405" text-anchor="middle" font-size="11" fill="#475569">Terikat ke spreadsheet (getActiveSpreadsheet)</text>

  <!-- sheets -->
  <rect x="700" y="450" width="300" height="200" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="850" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">4 · DATABASE (Google Sheets)</text>
  <text x="850" y="500" text-anchor="middle" font-size="12" fill="#334155">Config · Users · Tagihan · Pembayaran</text>
  <text x="850" y="520" text-anchor="middle" font-size="12" fill="#334155">Tabungan · Rekap_Tabungan</text>
  <text x="850" y="540" text-anchor="middle" font-size="12" fill="#334155">Log_Akhir_Tahun · Petunjuk</text>
  <text x="850" y="572" text-anchor="middle" font-size="11" fill="#475569">Dibuat dari DATABASE-TAGIHAN-SD-TEMPLATE.xlsx</text>
  <text x="850" y="590" text-anchor="middle" font-size="11" fill="#475569">Data hanya ada di Drive pemilik, bukan di GitHub</text>
  <text x="850" y="630" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Jangan unggah spreadsheet berisi data asli ke GitHub</text>

  <!-- panah -->
  <path d="M230 175 H318" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M230 325 H280 V250 H318" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="274" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">① buka URL</text>
  <text x="274" y="165" text-anchor="middle" font-size="10" fill="#64748b">HTTPS</text>

  <path d="M470 420 V448" stroke="#7e22ce" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="484" y="438" font-size="11" font-weight="700" fill="#7e22ce">② muat pustaka</text>

  <path d="M620 190 H698" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="660" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">③ fetch POST</text>
  <text x="660" y="182" text-anchor="middle" font-size="10" fill="#64748b">text/plain</text>
  <path d="M698 232 H620" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="660" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">④ JSON</text>
  <text x="660" y="266" text-anchor="middle" font-size="10" fill="#64748b">{ok, data}</text>

  <path d="M850 420 V448" stroke="#334155" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="866" y="438" font-size="11" font-weight="700" fill="#334155">⑤ baca / tulis</text>

  <!-- legenda alur -->
  <rect x="30" y="450" width="260" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="160" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Alur satu permintaan</text>
  <text x="46" y="502" font-size="12" fill="#334155">① Pengguna membuka halaman</text>
  <text x="46" y="524" font-size="12" fill="#334155">② Browser memuat pustaka CDN</text>
  <text x="46" y="546" font-size="12" fill="#334155">③ app*.js memanggil srv(fn, args)</text>
  <text x="46" y="568" font-size="12" fill="#334155">④ Apps Script membalas JSON</text>
  <text x="46" y="590" font-size="12" fill="#334155">⑤ Data dibaca/ditulis ke Sheets</text>
  <text x="46" y="620" font-size="11" fill="#64748b">Kunci sambungan: link /exec di index.html</text>
  <text x="46" y="637" font-size="11" fill="#64748b">(meta api-url) harus sama dengan hasil deploy.</text>

  <!-- catatan kanan -->
  <rect x="1030" y="120" width="110" height="300" rx="12" fill="#fefce8" stroke="#eab308"/>
  <text x="1085" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Fungsi API</text>
  <g font-size="10.5" fill="#334155" text-anchor="middle">
    <text x="1085" y="172">authenticateUser</text>
    <text x="1085" y="190">getData / getMine</text>
    <text x="1085" y="208">saveTagihan</text>
    <text x="1085" y="226">catatBayar</text>
    <text x="1085" y="244">saveUser</text>
    <text x="1085" y="262">importUsers</text>
    <text x="1085" y="280">simpanTabungan</text>
    <text x="1085" y="298">cairkanTabungan</text>
    <text x="1085" y="316">getAkhirTahun</text>
    <text x="1085" y="334">naikKelas</text>
    <text x="1085" y="352">getDataAlumni</text>
    <text x="1085" y="370">hapusAlumni</text>
    <text x="1085" y="394" fill="#64748b">dst. (daftar const API)</text>
  </g>
  <path d="M1000 270 H1028" stroke="#eab308" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
</svg>
